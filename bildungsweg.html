<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bildungsweg</title>
<style>body{margin:0;background:#fffaf5;color:#302820;font:18px system-ui}main{max-width:640px;margin:auto;padding:20px}button,a,textarea{font:inherit}button,a{display:inline-block;padding:12px;margin:5px;border:1px solid #dfbea7;border-radius:8px;background:white;color:inherit;text-decoration:none}button[aria-pressed=true]{background:#ffe2c9;border-color:#c85d19}section{margin:24px 0}textarea{box-sizing:border-box;width:100%;min-height:110px;padding:12px;border:1px solid #bbb;border-radius:8px}.path{line-height:1.8;border-left:4px solid #df751f;padding:16px}button:focus-visible{outline:3px solid #df751f}</style>
<main><a href="index.html">← 返回课程路线</a><p>A2E2 L3 · Wiederholung</p><h1>Mein Bildungsweg</h1><p>Grundschule → …</p><section id="schools"></section><section id="next"></section><div class="path" id="result" aria-live="polite"></div><section><h2>Und in China?</h2><p>In China ist das ähnlich. / In China ist das anders.</p><textarea id="comparison" placeholder="Bei uns … / In Deutschland …, aber in China …"></textarea><p>教学简化模型；不涵盖各州教育制度的全部路径。</p></section></main>
<script>
const schools=['Hauptschule','Realschule','Gymnasium','Gesamtschule'];let chosen='',ending='';
const result=document.getElementById('result');
function render(){document.getElementById('schools').replaceChildren(...schools.map(s=>{const b=document.createElement('button');b.textContent=s;b.setAttribute('aria-pressed',String(chosen===s));b.onclick=()=>{chosen=s;ending='';render()};return b}));const options=chosen==='Gymnasium'?['Abitur → Universität']:chosen==='Gesamtschule'?['Schulabschluss → Ausbildung','Abitur → Universität']:['Schulabschluss → Ausbildung'];document.getElementById('next').replaceChildren(...(chosen?options.map(s=>{const b=document.createElement('button');b.textContent=s;b.setAttribute('aria-pressed',String(ending===s));b.onclick=()=>{ending=s;render()};return b}):[]));result.textContent=chosen?`Zuerst geht man in die Grundschule. Danach kann man die ${chosen} besuchen.${ending?' '+(ending.startsWith('Abitur')?'Mit dem Abitur kann man an der Universität studieren.':'Nach dem Schulabschluss kann man eine Ausbildung machen.'):''}`:'Wähle einen Schultyp.'}
render();
</script></html>
