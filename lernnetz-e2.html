<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mein Lernnetz · E2</title>
<style>body{margin:0;background:#fffaf5;color:#302820;font:17px system-ui}main{max-width:760px;margin:auto;padding:20px}button,a,select{font:inherit;padding:12px;border-radius:8px;border:1px solid #dfbea7;background:white;color:inherit}a{display:inline-block;text-decoration:none}article{padding:16px 0;border-bottom:1px solid #ddd}select{max-width:100%;margin-top:8px}p{line-height:1.6}nav{display:flex;gap:8px;flex-wrap:wrap}button[aria-pressed=true]{background:#ffe2c9}strong{display:block}</style>
<main><a href="index.html">← 返回课程路线</a><h1>Mein Lernnetz</h1><p>E2 Nach der Schulzeit · Was gehört für dich zusammen?</p><nav id="tabs"></nav><div id="cards"></div></main>
<script src="data/a2e1-l1-cards.js"></script><script src="data/a2e1-l1-review-cards.js"></script><script src="data/a2e1-l2-review-cards.js"></script><script src="data/a2e1-video-tasks.js"></script><script src="data/a2e2-nachsprechen.js"></script><script src="data/a2e2-course.js"></script>
<script>
const key='deutschstadt.preview.lessons.v01';let lesson='L1';const labels={L1:'Schulzeit',L2:'Studium / Ausbildung · Entscheidung · Meinung',L3:'Schulsystem'};
function load(){try{return JSON.parse(localStorage.getItem(key))||{lessons:{}}}catch{return{lessons:{}}}}
function render(){document.getElementById('tabs').replaceChildren(...Object.keys(labels).map(id=>{const b=document.createElement('button');b.textContent=labels[id];b.setAttribute('aria-pressed',String(id===lesson));b.onclick=()=>{lesson=id;render()};return b}));const store=load(),state=store.lessons?.[`A2E2${lesson}-review`]||{};document.getElementById('cards').replaceChildren(...window.A2E2_CARDS[lesson].map(card=>{const a=document.createElement('article'),title=document.createElement('strong'),meaning=document.createElement('p'),select=document.createElement('select');title.textContent=card.front;meaning.textContent=card.zh;[['later','Möchte ich später lernen'],['review','Noch unsicher'],['known','Kann ich verwenden']].forEach(([value,label])=>{const o=document.createElement('option');o.value=value;o.textContent=label;select.append(o)});select.value=state.known?.[card.id]?'known':state.review?.[card.id]?'review':'later';select.setAttribute('aria-label',card.front+' · Lernstatus');select.onchange=()=>{const saved=load();saved.lessons||={};const s=saved.lessons[`A2E2${lesson}-review`]||={known:{},review:{},xp:{}};s.known||={};s.review||={};delete s.known[card.id];delete s.review[card.id];if(select.value!=='later')s[select.value][card.id]=Date.now();s.updatedAt=new Date().toISOString();localStorage.setItem(key,JSON.stringify(saved))};a.append(title,meaning,select);return a}))}
render();
</script></html>
